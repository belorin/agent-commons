name: Verify
# 실행기 시험, 사건 로그 무결성, 그리고 회차 커밋이 기록 밖을 건드리지 않았는지 검사한다.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runtime tests
        run: npm test
      - name: Event log and files
        run: node src/cli.mjs verify
      - name: Preserve confirmed history
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-history.mjs "$BASE"
          fi
      - name: Tick commits touch only data/ and derived/
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "no base commit; skipping"; exit 0; fi
          node scripts/check-tick-paths.mjs "$BEFORE" "$AFTER"
