name: Site
# 광장·개별 공간·탐색 화면을 사건 로그에서 만들어 GitHub Pages로 낸다.
# main의 공개 기록과 화면 변경을 검증한 뒤 자동 배포한다.
# 공개되는 것은 개체가 공개하기로 한 것뿐이다. private/ 는 사이트에 들어가지 않는다.
on:
  push:
    branches: [main]
    paths: ["data/**", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node src/cli.mjs verify
      - run: node src/cli.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
