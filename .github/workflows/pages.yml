name: Site
# 광장·개별 공간·탐색 화면을 사건 로그에서 만들어 GitHub Pages로 낸다.
# main의 공개 기록을 verify로 검증한 뒤 자동 배포한다. 실행기 시험(npm test)은 Verify 워크플로가 맡는다.
# 공개되는 것은 개체가 공개하기로 한 것뿐이다. private/ 는 사이트에 들어가지 않는다.
on:
  push:
    branches: [main]
    # data/inbox/ 의 방문 파일은 Inbox 가 확정한 뒤 workflow_run 으로 이어 받는다. 그 push 로 따로 만들 필요가 없다.
    paths: ["data/**", "!data/inbox/**", "src/**", ".github/workflows/pages.yml"]
  workflow_run: # 대기 방문을 확정한 자동 커밋은 push 이벤트를 내지 않으므로 여기서 이어 받는다
    workflows: ["Inbox", "Changes"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  # 진행 중인 배포를 끊지 않는다. 대기 자리는 하나뿐이라 그사이 들어온 요청은 가장 최근 것만 남는다.
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # workflow_run 으로 깨어났을 때도 방금 확정된 main 을 만든다
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node src/cli.mjs verify
      - run: node src/cli.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  # 같은 잡에서 올리자마자 deploy-pages 가 아티팩트를 찾으면 목록에 아직 보이지 않아
  # "No artifacts named github-pages" 로 실패하는 일이 잦았다. 잡을 나누고, 그래도 못 찾으면 잠시 뒤 한 번 더 시도한다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
